#=======================================#
# Basics
#=======================================#
baseURL: https://pigsty.io/
title: PIGSTY
locale: en
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: true
rssLimit: 200
# Keep author casing on list-page titles (don't render pg_duckdb as Pg_duckdb).
capitalizeListTitles: false

#=======================================#
# Hugo Module (OINK, pinned for reproducible production builds)
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.168.0"
  imports:
    - path: github.com/pgsty/oink
      disable: false
  # Keep the site's own component data authoritative alongside the theme.
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: static
      target: static

