#=======================================#
# Basics
#=======================================#
baseURL: https://pigsty.io/
title: PIGSTY
locale: en
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: true
rssLimit: 200
# Keep author casing on list-page titles (don't render pg_duckdb as Pg_duckdb).
capitalizeListTitles: false

#=======================================#
# Hugo Module (replaces theme: docsy)
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.155.0"
  imports:
    - path: github.com/google/docsy
      disable: false

#=======================================#
# Menu Customization
#=======================================#
menu:
  main:
    # Documentation dropdown menu
    - identifier: docs
      name: Docs
      weight: 10
      url: /docs/
      pre: <i class='fa-solid fa-book'></i>
    - identifier: ext
      name: Exts
      weight: 15
      url: /ext/
      pre: <i class='fa-solid fa-puzzle-piece'></i>

#=======================================#
# Taxonomies Support
#=======================================#
taxonomies:
  module: module          # Pigsty INFRA NODE ETCD PGSQL REDIS MINIO DOCKER APP
  categories: categories  # Overview Concept Arch Config Param Playbook Admin Monitor Dashboard FAQ
  tags: tags              # misc

#=======================================#
# Blog Setting
#=======================================#
permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# External Services, Google Analytics
#=======================================#
services:
  googleAnalytics:
    id: "G-GHTFZDZ2V0"

#=======================================#
# Image processing configuration
#=======================================#
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

#=======================================#
# Markdown Configuration
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    # Use class-based Chroma output so Docsy can swap light/dark palettes
    # via CSS instead of baking light-theme colors into the generated HTML.
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS

# Keep ext HTML-only; large catalog outputs can exceed hosting limits.
cascade:
  - target:
      path: '{/ext,/ext/**}'
    outputs:
      - HTML

#=======================================#
# Site Params
#=======================================#
params:
  # metadata
  description: 'Pigsty is a free and open-source PostgreSQL distribution, a local-first RDS with battery-included monitoring, HA, PITR, IaC, and 555 PG extensions and 12 kernels'
  version: 4.4.0
  copyright:
    authors: Ruohang Feng
    from_year: 2018
  privacy_policy: /docs/about/privacy

  # Time format
  time_format_blog: 'January 02, 2006'
  time_format_default: '2006-01-02'

  # Project info
  archived_version: false
  url_latest_version: 'https://pigsty.io'
  github_repo: 'https://github.com/pgsty/pigsty.io'
  github_project_repo: 'https://github.com/pgsty/pigsty'

  # Version dropdown menu
  version_menu: "Ver"
  versions:
    - version: "Pigsty 中文网站"
      url: 'https://pigsty.cc'
    - version: "Pigsty v3.7 Doc"
      url: 'https://doc.pgsty.com'
    - version: "Pigsty v3.4 Doc"
      url: 'https://v34.pigsty.cc'
    - version: "Pigsty v2.7 Doc"
      url: 'https://v27.pigsty.cc'
    - version: "Pigsty v1.5 Doc"
      url: 'https://v15.pigsty.cc/docs'


  # Taxonomy display settings
  taxonomy:
    taxonomyCloud: [module, categories, tags]
    taxonomyCloudTitle: [Module, Category, Tags]
    taxonomyPageHeader: [Module, Category, Tags]

  # Article column width: normal (1050px, default) | wide (1300px) | full.
  # Override per page via front matter (page_width: wide) or per section via cascade.
  page_width: normal
  # ICP filing number (centered in the one-line footer; empty = hidden).
  footer_icp: ""

  # Site search is provided by our own ⌘K dialog (self-hosted lunr + /index.json).
  # Docsy offlineSearch MUST stay off: its offline-search.js fires $.ajax(undefined)
  # and throws when it cannot find a .td-search input on the page.
  offlineSearch: false
  prism_syntax_highlighting: false

  # UI settings
  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: "dark"
    sidebar_menu_compact: true
    sidebar_search_disable: false
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    ul_show: 3
    showLightDarkModeMenu: true
    # TOC highlighting is done by silo-docs.js (IntersectionObserver); Docsy's
    # Bootstrap ScrollSpy injection has an attribute-escaping bug and never worked.
    scrollSpy:
      disable: true
    # ---- Fumadocs-style sidebar chrome ----
    # Root dropdown below the search box: lists every sidebar_root_for: self section.
    sidebar_root_menu: true
    # Sidebar width (px): defaults 268/286 by breakpoint, drag-resizable & persisted;
    # min/max clamp the drag range, overridable per section via cascade.
    sidebar_width_min: 220
    sidebar_width_max: 480
    # Sidebar item overflow: ellipsis (default) | wrap.
    sidebar_item_overflow: ellipsis

    # Feedback section (requires Google Analytics)
    feedback:
      enable: true
      "yes": >-
        Thanks for the feedback! Please <a href="https://github.com/pgsty/pigsty/issues/new">let us know how we can improve</a>.
      "no": >-
        Sorry to hear that. Please <a href="https://github.com/pgsty/pigsty/issues/new">let us know how we can improve</a>.

    # Reading time
    readingtime:
      enable: false

  # Links
  links:
    user:
      - name: Email - Vonng
        url: 'mailto:rh@vonng.com'
        icon: fa fa-envelope
        desc: Send email to Vonng
      - name: GitHub - Vonng
        url: 'https://github.com/Vonng'
        icon: fab fa-github
        desc: Vonng's GitHub Profile
      - name: X - Vonng
        url: 'https://x.com/RonVonng'
        icon: fab fa-x-twitter
        desc: Follow Vonng on X for updates
      - name: X - Pigsty
        url: 'https://x.com/PlGSTY'
        icon: fab fa-twitter
        desc: Follow on Twitter for updates
      - name: LinkedIn - Vonng
        url: 'https://www.linkedin.com/in/vonng/'
        icon: fab fa-linkedin
        desc: Vonng on LinkedIn
    developer:
      - name: Discord
        url: 'https://discord.gg/wDzt5VyWEz'
        icon: fab fa-discord
        desc: Discord channel
      - name: Telegram
        url: 'https://t.me/joinchat/gV9zfZraNPM3YjFh'
        icon: fab fa-telegram
        desc: Telegram group
      - name: WeChat
        url: /img/pigsty/pigsty-cc.jpg
        icon: fab fa-weixin
        desc: WeChat group & official account
      - name: Discussion
        url: 'https://github.com/orgs/pgsty/discussions'
        icon: fab fa-discourse
        desc: Pigsty Discussion Forum
      - name: Repo
        url: 'https://github.com/pgsty/pigsty'
        icon: fab fa-github
        desc: Pigsty Discussion Forum
