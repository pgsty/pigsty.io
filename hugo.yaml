#=======================================#
# Taxonomies Support
#=======================================#
taxonomies:
  module: module          # Pigsty INFRA NODE ETCD PGSQL REDIS MINIO DOCKER APP
  categories: categories  # Overview Concept Arch Config Param Playbook Admin Monitor Dashboard FAQ
  tags: tags              # misc

#=======================================#
# Blog Setting
#=======================================#
permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# External Services, Google Analytics
#=======================================#
services:
  googleAnalytics:
    id: "G-GHTFZDZ2V0"

#=======================================#
# Image processing configuration
#=======================================#
imaging:
  resampleFilter: CatmullRom
  jpeg:
    quality: 75
  webp:
    quality: 75
  avif:
    quality: 75
  anchor: smart

#=======================================#
# Markdown Configuration
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    # OINK enhanced code blocks use class-based Chroma palettes.
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home:
    - HTML
    - RSS
    #- JSON
    - markdown
    - LLMS
  page:
    - HTML
    - markdown
  section:
    - HTML
    - RSS
    - print
    - markdown

# Keep ext HTML-only; large catalog outputs can exceed hosting limits.
cascade:
  - target:
      path: '{/ext,/ext/**}'
    outputs:
      - HTML

#=======================================#
# Site Params
#=======================================#
params:
  # metadata
  description: 'Pigsty is a free and open-source PostgreSQL distribution, a local-first RDS with battery-included monitoring, HA, PITR, IaC, 620 packaged PG extensions, and 12 kernels and solutions'
  version: v4.5.0           # Current source/docs baseline, {{< param version >}} in content
  version_short: v4.5       # Short form (major.minor) of the current source/docs baseline
  stable_version: v4.5.0    # Current public stable release; use for install and Git tag examples
  stable_version_short: v4.5
  pg_version: '18.6'        # Latest PostgreSQL minor release, {{< param pg_version >}} in content
  pig_version: 1.10.4        # Latest PIG release, {{< param pig_version >}} in PIG docs
  pigsty_version: 4.5.0     # Pigsty version embedded in PIG, {{< param pigsty_version >}} in PIG docs
  pig_catalog_count: 626    # Records in the PIG bundled catalog
  pgext_count: 620          # PGEXT packaged extensions as of 2026-10-28; matches data/pgext/extension.yaml
  pg_kernel_count: 12      # Homepage variants and solutions; excludes vanilla PG, includes Supabase, Citus, DocumentDB
  # Verified 2026-10-28 against pgsty/pigsty e7a77472: files/grafana/*.json (recursive), files/victoria/rules/*.yml.
  dashboard_count: 67
  recording_rule_count: 759
  alert_rule_count: 92
  pgext_url: https://pgext.cloud  # PG extension catalog site; link prefix for the landing-page extension index and metric cards
  copyright:
    authors: Ruohang Feng
    from_year: 2018
  privacy_policy: /docs/about/privacy

  # Time format
  time_format_blog: 'January 02, 2006'
  time_format_default: '2006-01-02'

  # Project info
  archived_version: false
  url_latest_version: 'https://pigsty.io'
  github_repo: 'https://github.com/pgsty/pigsty.io'
  github_project_repo: 'https://github.com/pgsty/pigsty'

  # Version dropdown menu
  version_menu: "Ver"
  versions:
    - version: "Pigsty v3.7 Doc"
      url: 'https://doc.pgsty.com'
    - version: "Pigsty v3.4 Doc"
      url: 'https://v34.pigsty.cc'
    - version: "Pigsty v2.7 Doc"
      url: 'https://v27.pigsty.cc'
    - version: "Pigsty v1.5 Doc"
      url: 'https://v15.pigsty.cc/docs'

  # Taxonomy display settings
  taxonomy:
    cloud: [module, categories, tags]
    cloud_title: [Module, Category, Tags]
    page_header: [Module, Category, Tags]

  # OINK documentation shell and book-content widths.
  page_width: normal
  reading_width: normal
  footer_center_info: ''

  # OINK local search and enhanced code blocks do not depend on remote runtimes.
  offline_search: true
  offline_search_on_serve: false
  offline_search_index: summary
  offline_search_summary_length: 100
  offline_search_max_results: 12
  highlight_classes: true

  # UI settings
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    blog_index_size: 10
    breadcrumb: true
    navbar_logo: true
    navbar_enabled: true
    footer_style: fat
    landing_search: true
    section_index: cards
    lastmod_commit: subject
    alt_site:
      label: 中文
      url: https://pigsty.cc
    typography: technical
    shell_types: [docs, blog, swagger]
    docs_section: docs
    blog_section: blog
    pager_types: [docs, blog]
    quick_links: [docs, ext, blog]
    sidebar_icon_policy: all
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 500
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    sidebar_expand_levels: 2
    dark_mode:
      enable: true
      show_menu: true
    scroll_spy: false
    image_zoom: true
    page_context_menu:
      enable: true
      assistant_links: false
    keyboard_nav: true

    # One-click structured feedback; emits gtag events when analytics exists.
    feedback:
      enable: true
      reasons: true

    # Reading time
    reading_time: false
