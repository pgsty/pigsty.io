#=======================================#
# Basics
#=======================================#
baseURL: https://pigsty.io/
title: PIGSTY
locale: en
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: true
rssLimit: 200
# Keep author casing on list-page titles (don't render pg_duckdb as Pg_duckdb).
capitalizeListTitles: false

#=======================================#
# Hugo Module (OINK, pinned for reproducible production builds)
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
      disable: false
  # Keep the site's own component data authoritative alongside the theme.
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: static
      target: static

#=======================================#
# Menu Customization
#=======================================#
menus:
  main:
    - identifier: docs
      name: Docs
      weight: 10
      pageRef: /docs
      params:
        columns: 2
    - identifier: docs-setup
      parent: docs
      name: Quick Start
      pageRef: /docs/setup
      weight: 10
      params:
        icon: fa-solid fa-rocket
        description: Install Pigsty starting from a single Linux host
    - identifier: docs-deploy
      parent: docs
      name: Production Deployment
      pageRef: /docs/deploy
      weight: 20
      params:
        icon: fa-solid fa-server
        description: Plan and deliver multi-node high-availability database services
    - identifier: docs-pgsql
      parent: docs
      name: PostgreSQL
      pageRef: /docs/pgsql
      weight: 30
      params:
        icon: fa-solid fa-database
        description: Clusters, services, backup, monitoring, and daily operations
    - identifier: docs-components
      parent: docs
      name: Component Manuals
      pageRef: /docs/pig
      weight: 40
      params:
        icon: fa-solid fa-toolbox
        description: Pig, Patroni, PgBouncer, pgBackRest, and related tools

    - identifier: ext
      name: Extensions
      weight: 20
      pageRef: /ext
      params:
        columns: 2
    - identifier: ext-list
      parent: ext
      name: Extension Catalog
      pageRef: /ext/list
      weight: 10
      params:
        icon: fa-solid fa-puzzle-piece
        description: Browse 575 packaged PostgreSQL extensions
    - identifier: ext-os
      parent: ext
      name: System Support
      pageRef: /ext/os
      weight: 20
      params:
        icon: fa-brands fa-linux
        description: Check operating-system and PostgreSQL compatibility
    - identifier: ext-repo
      parent: ext
      name: Software Repository
      pageRef: /docs/repo
      weight: 30
      params:
        icon: fa-solid fa-box-archive
        description: Configure Pigsty repositories and install extension packages

    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 30
    - identifier: price
      name: Services
      pageRef: /price
      weight: 40

#=======================================#
# Taxonomies Support
#=======================================#
taxonomies:
  module: module          # Pigsty INFRA NODE ETCD PGSQL REDIS MINIO DOCKER APP
  categories: categories  # Overview Concept Arch Config Param Playbook Admin Monitor Dashboard FAQ
  tags: tags              # misc

#=======================================#
# Blog Setting
#=======================================#
permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# External Services, Google Analytics
#=======================================#
services:
  googleAnalytics:
    id: "G-GHTFZDZ2V0"

#=======================================#
# Image processing configuration
#=======================================#
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

#=======================================#
# Markdown Configuration
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    # OINK enhanced code blocks use class-based Chroma palettes.
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home:
    - HTML
    - RSS
    #- JSON
    - markdown
    - LLMS
  page:
    - HTML
    - markdown
  section:
    - HTML
    - RSS
    - print
    - markdown

# Keep ext HTML-only; large catalog outputs can exceed hosting limits.
cascade:
  - target:
      path: '{/ext,/ext/**}'
    outputs:
      - HTML

#=======================================#
# Site Params
#=======================================#
params:
  # metadata
  description: 'Pigsty is a free and open-source PostgreSQL distribution, a local-first RDS with battery-included monitoring, HA, PITR, IaC, and 575 PG extensions and 12 kernels'
  version: v4.5.0           # Current source/docs baseline; not the public stable release until v4.5.0 ships
  version_short: v4.5       # Short form (major.minor) of the current source/docs baseline
  stable_version: v4.4.0    # Current public stable release; use for install and Git tag examples
  stable_version_short: v4.4
  pg_version: '18.6'        # Latest PostgreSQL minor release, {{< param pg_version >}} in content
  pig_version: 1.8.0        # Latest PIG release, {{< param pig_version >}} in PIG docs
  pigsty_version: 4.5.0     # Pigsty version embedded in PIG, {{< param pigsty_version >}} in PIG docs
  pgext_count: 576          # Number of packaged PG extensions, {{< param pgext_count >}} in content
  pgext_url: https://pgext.cloud  # PG extension catalog site; link prefix for the landing-page extension index and metric cards
  github_stars: '5.52k'     # Approximate GitHub star count shown in the custom navbar
  copyright:
    authors: Ruohang Feng
    from_year: 2018
  privacy_policy: /docs/about/privacy

  # Time format
  time_format_blog: 'January 02, 2006'
  time_format_default: '2006-01-02'

  # Project info
  archived_version: false
  url_latest_version: 'https://pigsty.io'
  github_repo: 'https://github.com/pgsty/pigsty.io'
  github_project_repo: 'https://github.com/pgsty/pigsty'

  # Version dropdown menu
  version_menu: "Ver"
  versions:
    - version: "Pigsty 中文网站"
      url: 'https://pigsty.cc'
    - version: "Pigsty v3.7 Doc"
      url: 'https://doc.pgsty.com'
    - version: "Pigsty v3.4 Doc"
      url: 'https://v34.pigsty.cc'
    - version: "Pigsty v2.7 Doc"
      url: 'https://v27.pigsty.cc'
    - version: "Pigsty v1.5 Doc"
      url: 'https://v15.pigsty.cc/docs'

  # Taxonomy display settings
  taxonomy:
    taxonomyCloud: [module, categories, tags]
    taxonomyCloudTitle: [Module, Category, Tags]
    taxonomyPageHeader: [Module, Category, Tags]

  # OINK documentation shell and book-content widths.
  page_width: normal
  content_width: norm
  footer_center_info: ''

  # OINK local search and enhanced code blocks do not depend on remote runtimes.
  offlineSearch: true
  offlineSearchOnServe: false
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 100
  offlineSearchMaxResults: 12
  highlight_classes: true
  prism_syntax_highlighting: false

  # UI settings
  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_enabled: true
    footer_style: fat
    landing_search: true
    section_index: cards
    lastmod_commit: subject
    github_stars: '5.52k'
    alt_site:
      label: 中文
      url: https://pigsty.cc
    typography:
      preset: technical
    shell_types: [docs, blog, swagger]
    docs_section: docs
    blog_section: blog
    pager:
      types: [docs, blog]
    quick_links: [docs, ext, blog]
    sidebar_icon_policy: all
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 500
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    ul_show: 2
    showLightDarkModeMenu: true
    scrollSpy:
      disable: true
    image_zoom:
      enable: true
    page_context_menu:
      enable: true
      assistant_links: false
    keyboard_nav:
      enable: true

    # One-click structured feedback; emits gtag events when analytics exists.
    feedback:
      enable: true
      reasons: true

    # Reading time
    readingtime:
      enable: false

  # Links
  links:
    user:
      - name: Email - Vonng
        url: 'mailto:rh@vonng.com'
        icon: fa fa-envelope
        desc: Send email to Vonng
      - name: GitHub - Vonng
        url: 'https://github.com/Vonng'
        icon: fab fa-github
        desc: Vonng's GitHub Profile
      - name: X - Vonng
        url: 'https://x.com/RonVonng'
        icon: fab fa-x-twitter
        desc: Follow Vonng on X for updates
      - name: X - Pigsty
        url: 'https://x.com/PlGSTY'
        icon: fab fa-twitter
        desc: Follow Pigsty on X for updates
      - name: LinkedIn - Vonng
        url: 'https://www.linkedin.com/in/vonng/'
        icon: fab fa-linkedin
        desc: Follow Vonng on LinkedIn
    developer:
      - name: Discord
        url: 'https://discord.gg/wDzt5VyWEz'
        icon: fab fa-discord
        desc: Discord channel
      - name: Telegram
        url: 'https://t.me/joinchat/gV9zfZraNPM3YjFh'
        icon: fab fa-telegram
        desc: Telegram group
      - name: WeChat
        url: /img/pigsty/pigsty-cc.jpg
        icon: fab fa-weixin
        desc: WeChat group and official account
      - name: Discussion
        url: 'https://github.com/orgs/pgsty/discussions'
        icon: fab fa-discourse
        desc: Pigsty discussion forum
      - name: GitHub
        url: 'https://github.com/pgsty/pigsty'
        icon: fab fa-github
        desc: Pigsty code repository
